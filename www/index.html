<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>تماريني</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232732;--text:#f1f3f7;--muted:#8b93a5;--accent:#ff6b35;--danger:#e5484d;--ok:#30a46c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--card2)}
header h1{flex:1;margin:0;font-size:20px}
.icon-btn{background:var(--card);border:0;color:var(--text);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer}
.icon-btn.danger{color:var(--danger)}
main{padding:16px 16px 110px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.day-card{display:flex;align-items:center;gap:12px;cursor:pointer}
.day-card .info{flex:1}
.day-card .wd{font-size:18px;font-weight:700}
.day-card .sub{color:var(--muted);font-size:14px;margin-top:4px}
.badge{background:var(--accent);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.arrow{color:var(--muted);font-size:20px}
.ex-name{font-size:17px;font-weight:700}
.ex-meta{color:var(--accent);font-size:14px;margin-top:4px}
.ex-notes{color:var(--muted);font-size:14px;margin-top:6px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;color:var(--text);background:var(--card2);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.ok{background:var(--ok);color:#fff}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:15px 22px;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.9}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 16px;font-size:18px}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--card2);color:var(--text);border-radius:12px;padding:13px;font-size:16px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.player{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.player .bar{display:flex;align-items:center;gap:10px;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));color:#fff}
.player .bar span{flex:1;font-weight:700}
.player video{flex:1;width:100%;min-height:0;background:#000}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);padding:11px 20px;border-radius:99px;z-index:40;font-size:14px}
.size{color:var(--muted);font-size:12px;align-self:center}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="picker" accept="video/*" hidden>

<script>
"use strict";
var WEEK = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
var db = null;
var data = { days: [] };
var pendingVideoFor = null;
var currentObjectUrl = null;

/* ---------- storage ---------- */
function openDB() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open("gym-app", 1);
    r.onupgradeneeded = function () {
      r.result.createObjectStore("kv");
      r.result.createObjectStore("videos");
    };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function run(store, mode, fn) {
  return new Promise(function (res, rej) {
    var t = db.transaction(store, mode);
    var rq = fn(t.objectStore(store));
    t.oncomplete = function () { res(rq ? rq.result : undefined); };
    t.onerror = t.onabort = function () { rej(t.error); };
  });
}
function save() { return run("kv", "readwrite", function (s) { return s.put(data, "data"); }); }
function putVideo(id, blob) { return run("videos", "readwrite", function (s) { return s.put(blob, id); }); }
function getVideo(id) { return run("videos", "readonly", function (s) { return s.get(id); }); }
function delVideo(id) { return run("videos", "readwrite", function (s) { return s.delete(id); }); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function todayIndex() { return (new Date().getDay() + 1) % 7; }
function sortedDays() { return data.days.slice().sort(function (a, b) { return a.wd - b.wd; }); }
function findDay(id) { return data.days.filter(function (d) { return d.id === id; })[0]; }
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB"; }
function toast(msg) {
  var t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2200);
}
function closeOverlay() { var o = document.getElementById("ov"); if (o) o.remove(); }
function openSheet(html) {
  closeOverlay();
  var o = document.createElement("div");
  o.className = "overlay"; o.id = "ov";
  o.innerHTML = '<div class="sheet">' + html + "</div>";
  o.addEventListener("click", function (e) { if (e.target === o) closeOverlay(); });
  document.body.appendChild(o);
  return o;
}
function confirmSheet(msg, onYes) {
  var o = openSheet('<h2>' + esc(msg) + '</h2><div class="row"><button class="btn danger" id="yes">نعم، احذف</button><button class="btn" id="no">إلغاء</button></div>');
  o.querySelector("#yes").onclick = function () { closeOverlay(); onYes(); };
  o.querySelector("#no").onclick = closeOverlay;
}

/* ---------- routing ---------- */
function go(h) { location.hash = h; }
window.addEventListener("hashchange", render);

function render() {
  closeOverlay();
  stopPlayer(true);
  var parts = (location.hash || "#/").replace(/^#\/?/, "").split("/");
  if (parts[0] === "day" && parts[1] && findDay(parts[1])) {
    renderDay(parts[1]);
    if (parts[2] === "play" && parts[3]) openPlayer(parts[1], parts[3]);
  } else {
    renderHome();
  }
}

/* ---------- home ---------- */
function renderHome() {
  var days = sortedDays();
  var h = '<header><h1>🏋️ جدول تماريني</h1></header><main>';
  if (!days.length) {
    h += '<div class="empty">لسه مفيش أيام.<br>اضغط «+ يوم» وابدأ حدد أيام تمرينك.</div>';
  }
  days.forEach(function (d) {
    h += '<div class="card day-card" data-id="' + d.id + '"><div class="info"><div class="wd">' + WEEK[d.wd] +
      (d.wd === todayIndex() ? ' <span class="badge">النهاردة</span>' : '') +
      '</div><div class="sub">' + esc(d.title || "بدون عنوان") + ' · ' + d.exercises.length + ' تمرين</div></div><div class="arrow">‹</div></div>';
  });
  h += '</main><button class="fab" id="addDay">+ يوم</button>';
  document.getElementById("app").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll(".day-card"), function (el) {
    el.onclick = function () { go("#/day/" + el.dataset.id); };
  });
  document.getElementById("addDay").onclick = addDaySheet;
}

function addDaySheet() {
  var used = data.days.map(function (d) { return d.wd; });
  var opts = "";
  WEEK.forEach(function (w, i) { if (used.indexOf(i) < 0) opts += '<option value="' + i + '">' + w + "</option>"; });
  if (!opts) { toast("كل أيام الأسبوع مضافة"); return; }
  var o = openSheet('<h2>إضافة يوم تمرين</h2><label>اليوم</label><select id="wd">' + opts +
    '</select><label>عنوان اليوم (مثلاً: صدر وترايسبس)</label><input id="ttl" maxlength="40">' +
    '<div class="row"><button class="btn primary" id="ok">حفظ</button><button class="btn" id="cancel">إلغاء</button></div>');
  o.querySelector("#cancel").onclick = closeOverlay;
  o.querySelector("#ok").onclick = function () {
    data.days.push({ id: uid(), wd: parseInt(o.querySelector("#wd").value, 10), title: o.querySelector("#ttl").value.trim(), exercises: [] });
    save().then(function () { closeOverlay(); render(); });
  };
}

/* ---------- day ---------- */
function renderDay(id) {
  var d = findDay(id);
  var h = '<header><button class="icon-btn" id="back">›</button><h1>' + WEEK[d.wd] + (d.title ? " · " + esc(d.title) : "") +
    '</h1><button class="icon-btn" id="editDay">✏️</button><button class="icon-btn danger" id="delDay">🗑</button></header><main>';
  if (!d.exercises.length) h += '<div class="empty">مفيش تمارين في اليوم ده.<br>اضغط «+ تمرين».</div>';
  d.exercises.forEach(function (ex) {
    h += '<div class="card" data-ex="' + ex.id + '"><div class="ex-name">' + esc(ex.name) + "</div>" +
      (ex.sets ? '<div class="ex-meta">' + esc(ex.sets) + "</div>" : "") +
      (ex.notes ? '<div class="ex-notes">' + esc(ex.notes) + "</div>" : "") +
      '<div class="row">';
    if (ex.videoId) {
      h += '<button class="btn ok" data-act="play">▶ شغّل الفيديو</button><button class="btn danger" data-act="delvid">حذف الفيديو</button>' +
        '<span class="size">' + fmtSize(ex.videoSize || 0) + "</span>";
    } else {
      h += '<button class="btn" data-act="addvid">🎬 إضافة فيديو</button>';
    }
    h += '<button class="btn" data-act="edit">تعديل</button><button class="btn danger" data-act="del">حذف التمرين</button></div></div>';
  });
  h += '</main><button class="fab" id="addEx">+ تمرين</button>';
  document.getElementById("app").innerHTML = h;

  document.getElementById("back").onclick = function () { go("#/"); };
  document.getElementById("addEx").onclick = function () { exerciseSheet(id, null); };
  document.getElementById("editDay").onclick = function () { editDaySheet(id); };
  document.getElementById("delDay").onclick = function () {
    confirmSheet("حذف اليوم وكل تمارينه وفيديوهاته؟", function () {
      var ps = d.exercises.filter(function (e) { return e.videoId; }).map(function (e) { return delVideo(e.videoId); });
      Promise.all(ps).then(function () {
        data.days = data.days.filter(function (x) { return x.id !== id; });
        return save();
      }).then(function () { go("#/"); });
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function (b) {
    b.onclick = function () {
      var exId = b.closest(".card").dataset.ex;
      var ex = d.exercises.filter(function (e) { return e.id === exId; })[0];
      var act = b.dataset.act;
      if (act === "play") go("#/day/" + id + "/play/" + exId);
      else if (act === "addvid") pickVideo(id, exId);
      else if (act === "edit") exerciseSheet(id, ex);
      else if (act === "delvid") confirmSheet("حذف الفيديو؟", function () { removeVideo(id, exId); });
      else if (act === "del") confirmSheet("حذف التمرين؟", function () {
        (ex.videoId ? delVideo(ex.videoId) : Promise.resolve()).then(function () {
          d.exercises = d.exercises.filter(function (e) { return e.id !== exId; });
          return save();
        }).then(render);
      });
    };
  });
}

function editDaySheet(id) {
  var d = findDay(id);
  var o = openSheet('<h2>تعديل عنوان اليوم</h2><label>العنوان</label><input id="ttl" maxlength="40" value="' + esc(d.title) +
    '"><div class="row"><button class="btn primary" id="ok">حفظ</button><button class="btn" id="cancel">إلغاء</button></div>');
  o.querySelector("#cancel").onclick = closeOverlay;
  o.querySelector("#ok").onclick = function () {
    d.title = o.querySelector("#ttl").value.trim();
    save().then(render);
  };
}

function exerciseSheet(dayId, ex) {
  var d = findDay(dayId);
  var o = openSheet('<h2>' + (ex ? "تعديل التمرين" : "إضافة تمرين") + '</h2>' +
    '<label>اسم التمرين</label><input id="nm" maxlength="60" value="' + esc(ex ? ex.name : "") + '">' +
    '<label>المجموعات × العدّات (مثلاً: 4 × 10)</label><input id="st" maxlength="30" value="' + esc(ex ? ex.sets : "") + '">' +
    '<label>ملاحظات</label><textarea id="nt" maxlength="300">' + esc(ex ? ex.notes : "") + '</textarea>' +
    '<div class="row"><button class="btn primary" id="ok">حفظ</button><button class="btn" id="cancel">إلغاء</button></div>');
  o.querySelector("#cancel").onclick = closeOverlay;
  o.querySelector("#ok").onclick = function () {
    var name = o.querySelector("#nm").value.trim();
    if (!name) { toast("اكتب اسم التمرين"); return; }
    var sets = o.querySelector("#st").value.trim(), notes = o.querySelector("#nt").value.trim();
    if (ex) { ex.name = name; ex.sets = sets; ex.notes = notes; }
    else d.exercises.push({ id: uid(), name: name, sets: sets, notes: notes, videoId: null, videoSize: 0 });
    save().then(render);
  };
}

/* ---------- video ---------- */
var picker = document.getElementById("picker");
function pickVideo(dayId, exId) { pendingVideoFor = { dayId: dayId, exId: exId }; picker.value = ""; picker.click(); }
picker.addEventListener("change", function () {
  var f = picker.files && picker.files[0];
  var target = pendingVideoFor;
  pendingVideoFor = null;
  if (!f || !target) return;
  var d = findDay(target.dayId);
  var ex = d && d.exercises.filter(function (e) { return e.id === target.exId; })[0];
  if (!ex) return;
  toast("جاري حفظ الفيديو...");
  var vid = uid();
  putVideo(vid, f).then(function () {
    var old = ex.videoId;
    ex.videoId = vid; ex.videoSize = f.size;
    return save().then(function () { return old ? delVideo(old) : null; });
  }).then(function () { toast("تم حفظ الفيديو ✅"); render(); })
    .catch(function () { toast("فشل الحفظ، المساحة ممكن تكون ممتلئة"); });
});
function removeVideo(dayId, exId) {
  var ex = findDay(dayId).exercises.filter(function (e) { return e.id === exId; })[0];
  delVideo(ex.videoId).then(function () {
    ex.videoId = null; ex.videoSize = 0;
    return save();
  }).then(render);
}
function openPlayer(dayId, exId) {
  var ex = findDay(dayId).exercises.filter(function (e) { return e.id === exId; })[0];
  if (!ex || !ex.videoId) return;
  getVideo(ex.videoId).then(function (blob) {
    if (!blob) { toast("الفيديو مش موجود"); return; }
    stopPlayer(true);
    currentObjectUrl = URL.createObjectURL(blob);
    var p = document.createElement("div");
    p.className = "player"; p.id = "player";
    p.innerHTML = '<div class="bar"><button class="icon-btn" id="closeP">✕</button><span>' + esc(ex.name) +
      '</span></div><video controls playsinline autoplay loop src="' + currentObjectUrl + '"></video>';
    document.body.appendChild(p);
    p.querySelector("#closeP").onclick = function () { history.back(); };
  });
}
function stopPlayer(silent) {
  var p = document.getElementById("player");
  if (p) { var v = p.querySelector("video"); if (v) { v.pause(); v.removeAttribute("src"); } p.remove(); }
  if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
}

/* ---------- start ---------- */
openDB().then(function (d) {
  db = d;
  return run("kv", "readonly", function (s) { return s.get("data"); });
}).then(function (saved) {
  if (saved && saved.days) data = saved;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  render();
}).catch(function () {
  document.getElementById("app").innerHTML = '<div class="empty">حصلت مشكلة في فتح التخزين.</div>';
});
</script>
</body>
</html>
